# Mesmas verificações do portão de qualidade (docs/estrategia-de-testes.md), em todo push e PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, arquitetura e unitários
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar-pnpm
      - run: pnpm check
      - run: pnpm codigo-morto
      - run: pnpm specs
      - name: Dependências vulneráveis (altas e críticas)
        run: pnpm audit --audit-level high

  integracao:
    name: Integração (Postgres via Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar-pnpm
      - run: pnpm test:integracao

  e2e:
    name: Ponta a ponta (Chromium, Firefox, WebKit) e build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar-pnpm
      # setup.sh é idempotente: com o store em cache a instalação é rápida; ele cuida dos navegadores e do .env
      - name: Navegadores do Playwright e .env
        run: bash scripts/setup.sh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: pnpm test:e2e:todos
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: relatorio-playwright
          path: reports/playwright
          retention-days: 7

  segredos:
    name: Segredos vazados (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/preparar-pnpm
      # Mesma varredura do portão local (gitleaks em imagem com versão fixa, histórico inteiro, só leitura;
      # reprova varredura de 0 commits). Substitui a gitleaks-action, que falhava no primeiro push
      # (o commit raiz não tem pai) e recebia o GITHUB_TOKEN sem precisar.
      - run: pnpm segredos
